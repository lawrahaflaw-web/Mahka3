<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحكايات — مَحكى</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img data-site-logo hidden class="brand-logo" alt="">
      <span class="brand-name" data-site-name></span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">الرئيسية</a>
      <a href="stories.html">الحكايات</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="القائمة"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section class="section page-head">
    <div class="container">
      <h1 id="pageHeading">كل الحكايات</h1>
      <form class="filters-bar" id="filtersForm">
        <input type="search" name="q" id="searchInput" placeholder="ابحث عن حكاية…">
        <select name="category" id="categorySelect"><option value="">كل التصنيفات</option></select>
        <select name="sort" id="sortSelect">
          <option value="recent">الأحدث</option>
          <option value="most_listened">الأكثر استماعًا</option>
        </select>
        <button type="submit" class="btn-secondary">تصفية</button>
      </form>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="story-grid" id="storiesGrid"><p class="empty-state">جارٍ التحميل…</p></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand"><span class="brand-name" data-site-name></span><p data-site-tagline></p></div>
    <div class="footer-links"><a href="index.html">الرئيسية</a><a href="stories.html">الحكايات</a></div>
  </div>
  <div class="container footer-bottom"><p>© <span data-current-year></span> <span data-site-name></span> — <span data-footer-text></span></p></div>
</footer>

<div class="sticky-player" id="stickyPlayer" hidden>
  <div class="container player-inner">
    <img id="playerCover" src="" alt="">
    <div class="player-meta"><strong id="playerTitle"></strong><span id="playerNarrator"></span></div>
    <div class="player-controls"><button id="playerBack10">⏪</button><button id="playerToggle">▶</button><button id="playerFwd10">⏩</button></div>
    <div class="player-progress"><span id="playerCurrent">٠:٠٠</span><input type="range" id="playerSeek" value="0" min="0" max="100" step="0.1"><span id="playerDuration">٠:٠٠</span></div>
    <select id="playerSpeed"><option value="0.75">×0.75</option><option value="1" selected>×1</option><option value="1.25">×1.25</option><option value="1.5">×1.5</option><option value="2">×2</option></select>
    <audio id="audioEl" preload="none"></audio>
  </div>
</div>

<script src="assets/js/site.js"></script>
<script src="assets/js/player.js"></script>
<script>
document.getElementById('navToggle').addEventListener('click', () => document.getElementById('mainNav').classList.toggle('open'));

(async function () {
  const [stories, categories, settings] = await Promise.all([Mahka.getStories(), Mahka.getCategories(), Mahka.getSettings()]);
  Mahka.applySettingsToDom(settings);
  const catMap = Mahka.categoriesById(categories);
  const params = new URLSearchParams(location.search);

  categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.slug; opt.textContent = c.name;
    document.getElementById('categorySelect').appendChild(opt);
  });

  const initialCategory = params.get('category') || '';
  const initialSort = params.get('sort') || 'recent';
  const initialSearch = params.get('q') || '';
  document.getElementById('categorySelect').value = initialCategory;
  document.getElementById('sortSelect').value = initialSort;
  document.getElementById('searchInput').value = initialSearch;

  function render() {
    const category = document.getElementById('categorySelect').value;
    const sort = document.getElementById('sortSelect').value;
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

    let items = stories.filter(s => s.status === 'published');
    if (category) {
      const cat = categories.find(c => c.slug === category);
      items = items.filter(s => cat && s.category_id === cat.id);
      document.getElementById('pageHeading').textContent = cat ? cat.name : 'كل الحكايات';
    } else {
      document.getElementById('pageHeading').textContent = 'كل الحكايات';
    }
    if (q) {
      items = items.filter(s =>
        (s.title||'').toLowerCase().includes(q) ||
        (s.description||'').toLowerCase().includes(q) ||
        (s.narrator||'').toLowerCase().includes(q));
    }
    items = sort === 'most_listened'
      ? [...items].sort((a,b) => (b.listens_count||0)-(a.listens_count||0))
      : [...items].sort((a,b) => new Date(b.created_at)-new Date(a.created_at));

    document.getElementById('storiesGrid').innerHTML = items.length
      ? items.map(s => Mahka.storyCardHTML(s, catMap)).join('')
      : '<p class="empty-state">لا توجد حكايات مطابقة.</p>';
  }

  document.getElementById('filtersForm').addEventListener('submit', e => { e.preventDefault(); render(); });
  document.getElementById('categorySelect').addEventListener('change', render);
  document.getElementById('sortSelect').addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
